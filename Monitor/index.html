<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GSE 월드 모니터</title>
<link rel="stylesheet" href="/style.css">
<script defer src="/app.js">
</script>
</head>
<body>
<header>
<div>
<small>GSE · LOCAL OBSERVATORY</small>
<h1>월드 모니터</h1>
<p>마을의 변화와 주민의 현재 상태를 한눈에 확인하세요.</p>
</div>
<div>
<span id="connection" class="badge">수신 대기</span>
<p id="received">게임을 실행하면 자동으로 연결됩니다.</p>
<a href="/api/state" target="_blank" rel="noopener">원본 JSON 열기 ↗</a>
</div>
</header>
<main>
<div id="notice" class="notice">로컬 수신 서버 연결 중…</div>
<section aria-label="전체 집계" id="totals" class="totals">
</section>
<div class="section-title">
<h2>월드 · 마을 상태</h2>
<span>0.5초마다 갱신 · 마지막 관측값</span>
</div>
<section id="worlds" class="worlds">
</section>
<section class="panel">
<div class="section-title">
<h2>NPC 상태</h2>
<div class="filters">
<label>월드 <select id="worldFilter">
<option value="">전체</option>
</select>
</label>
<label>상태 <select id="stateFilter">
<option value="">전체</option>
<option value="walking">이동</option>
<option value="idle">대기</option>
<option value="talking">대화</option>
<option value="frozen">정지</option>
<option value="inactive">비활성</option>
</select>
</label>
<input id="search" aria-label="NPC 이름 검색" placeholder="NPC 이름 검색">
</div>
</div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>NPC / Actor</th>
<th>월드 · 세션</th>
<th>상태</th>
<th>현재 행동</th>
<th>사건 역할 / 서비스</th>
<th>위치 (X, Y)</th>
<th>이야기 기록</th>
</tr>
</thead>
<tbody id="npcs">
</tbody>
</table>
</div>
<p id="rowCount" class="muted">
</p>
</section>
<footer>이 화면은 관측 전용입니다. 비활성 월드는 마지막 상태를 표시하며, 월드 이동·저장 데이터 통합 방식은 아직 확정되지 않았습니다.</footer>
</main>
</body>
</html>
